name: Editorial workbench verification
on:
  pull_request:
    paths:
      - 'creator/**'
      - 'tests/**'
      - 'start-windows.cmd'
      - '.github/workflows/editorial-tests.yml'
permissions:
  contents: read
jobs:
  workflow:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
